<svg xmlns="http://www.w3.org/2000/svg" viewBox="396 6 172 172" role="img" aria-labelledby="sfm-title">
  <title id="sfm-title">Sassy Foodie</title>
  <!--
    The badge: a frying pan seen from above, holding the Philadelphia skyline,
    with a chef's toque on the tallest tower and fire licking up the rim.

    THREE THINGS KEEP THIS A PAN AND NOT A MAGNIFYING GLASS, and all three were
    learned by rendering it wrong first:
      1. The fire is WARM. A violet flame is a decorative wisp; the heat cue is
         what tells the eye this is a cooking vessel. The flames are the one
         place on this site where heat outranks the accent colour.
      2. The handle is a stubby, heavily tapered wedge - 34 units at the pan,
         14 at the tip. A thin uniform stick at the letter weight is the search
         icon, exactly.
      3. The rim stroke (18) is thicker than the wordmark stroke (14).

    Every colour is var(TOKEN, REAL FALLBACK). The fallbacks are not decoration:
    this file is a favicon and a social avatar, where no CSS custom property is
    ever set, and a `transparent` fallback would leave the pan with no face.
  -->
  <defs>
    <!-- everything except the pan's face, so flames tuck behind the rim -->
    <clipPath id="sfm-outside">
      <path clip-rule="evenodd" d="M390 0 H580 V190 H390 Z
        M436 99 A42 42 0 1 0 520 99 A42 42 0 1 0 436 99 Z"/>
    </clipPath>
    <clipPath id="sfm-inside"><circle cx="478" cy="99" r="42"/></clipPath>
    <path id="sfm-flame" d="M -13 0
      C -18 -22 -12 -38 -2 -50
      C 4 -58 6 -66 4 -78
      C 16 -66 20 -50 16 -34
      C 13 -20 12 -8 13 0 Z"/>
  </defs>

  <g clip-path="url(#sfm-outside)">
    <!-- outer fire -->
    <g fill="var(--heat, #C02C4A)">
      <use href="#sfm-flame" transform="translate(429.0 116.0) rotate(-26) scale(0.86)"/>
      <use href="#sfm-flame" transform="translate(425.5 86.0)  rotate(-12) scale(0.80)"/>
      <use href="#sfm-flame" transform="translate(447.0 55.0)  rotate(10)  scale(0.62)"/>
      <use href="#sfm-flame" transform="translate(444.0 139.0) rotate(-38) scale(0.60)"/>
      <use href="#sfm-flame" transform="translate(526.0 122.0) rotate(26)  scale(0.72)"/>
      <use href="#sfm-flame" transform="translate(512.0 142.0) rotate(40)  scale(0.52)"/>
    </g>
    <!-- inner tongues: the hot core of the same fire -->
    <g fill="var(--brass-hi, #F0CE8E)">
      <use href="#sfm-flame" transform="translate(430.5 116.0) rotate(-24) scale(0.46)"/>
      <use href="#sfm-flame" transform="translate(427.5 88.0)  rotate(-10) scale(0.42)"/>
      <use href="#sfm-flame" transform="translate(525.0 122.0) rotate(24)  scale(0.38)"/>
    </g>
  </g>

  <circle cx="478" cy="99" r="42" fill="var(--ink, #0B0910)"/>

  <!-- Philadelphia. Deliberately uneven - a low wide block, a dip, the tall
       tower with a real setback, a spire, and two shorter masses. Five bars
       climbing in even steps at even widths reads as a chart, not a city. -->
  <g clip-path="url(#sfm-inside)" fill="var(--ivory, #F4EDE4)">
    <rect x="442" y="110" width="12" height="42"/>
    <rect x="456" y="124" width="7"  height="28"/>
    <path d="M 465 152 L 465 98 L 469 98 L 469 88 L 485 88 L 485 98 L 489 98 L 489 152 Z"/>
    <path d="M 494 152 L 494 104 L 498 88 L 502 104 L 502 152 Z"/>
    <rect x="505" y="112" width="8"  height="40"/>
    <!-- the toque, on a band, overhanging its tower on both sides so it stays
         a hat and not a lump when the mark is drawn small -->
    <rect x="464" y="82" width="26" height="6"/>
    <path d="M 464 82
      C 456.9 82 455.1 75 461.6 73
      C 459.9 67 467.0 64.5 471.1 68
      C 475.2 63 483.5 65 484.1 70
      C 491.8 69.5 495.3 76 490 82 Z"/>
  </g>

  <!-- the handle: stubby and heavily tapered, 34 units at the pan to 14 at the
       tip. This is the shape that says cast iron rather than lens. -->
  <path fill="var(--ivory, #F4EDE4)"
        d="M 504 49 L 547.1 18.5 A 7 7 0 0 1 558.5 29.9 L 528 73 Z"/>
  <circle cx="478" cy="99" r="51" fill="none"
          stroke="var(--ivory, #F4EDE4)" stroke-width="18"/>
</svg>
