<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 807 190" role="img" aria-labelledby="sf3-title sf3-desc">
  <title id="sf3-title">Sassy Foodie</title>
  <desc id="sf3-desc">Wordmark for Chef Daija's Sassy Foodie, Philadelphia. The first O of FOODIE is a frying pan seen from above, handle raised, holding the Philadelphia skyline with a chef's toque crowning the tallest tower, and flames licking up around the rim.</desc>

  <!-- The lockup. For a favicon or an avatar use assets/logo-mark.svg instead:
       an SVG fragment reference in <link rel="icon"> is not reliably supported,
       and a plain 32px render of THIS file squashes the whole 807x176 lockup
       into an unreadable 6px sliver. -->
  <view id="mark" viewBox="411 14 145 145"/>
  <view id="lockup" viewBox="0 0 807 190"/>

  <defs>
    <!-- everything except the pan's inside face, so flames tuck behind the rim -->
    <clipPath id="sf3-outside">
      <path clip-rule="evenodd" d="M0 0 H807 V176 H0 Z
        M436 99 A42 42 0 1 0 520 99 A42 42 0 1 0 436 99 Z"/>
    </clipPath>
    <clipPath id="sf3-inside">
      <circle cx="478" cy="99" r="42"/>
    </clipPath>

    <!-- one flame tongue, drawn once, placed four times -->
    <path id="sf3-flame" d="M -13 0
      C -18 -22 -12 -38 -2 -50
      C 4 -58 6 -66 4 -78
      C 16 -66 20 -50 16 -34
      C 13 -20 12 -8 13 0 Z"/>

    <!-- one monoline S, drawn once, used three times -->
    <path id="sf3-s" d="M 63 83
      C 63 76.5 56 73 47 73
      C 38 73 31 76.5 31 83
      C 31 90 37 95 47 99
      C 57 103 63 108 63 115
      C 63 121.5 56 125 47 125
      C 38 125 31 121.5 31 115"/>
  </defs>

  <!-- ===================== THE MARK: the pan is the O ===================== -->
  <g>
    <!-- flames, clipped out of the pan face -->
    <g clip-path="url(#sf3-outside)">
      <g fill="var(--heat, #C02C4A)">
        <use href="#sf3-flame" transform="translate(429.0 116.0) rotate(-26) scale(0.86)"/>
        <use href="#sf3-flame" transform="translate(425.5 86.0)  rotate(-12) scale(0.80)"/>
        <use href="#sf3-flame" transform="translate(447.0 55.0)  rotate(10)  scale(0.62)"/>
        <use href="#sf3-flame" transform="translate(444.0 139.0) rotate(-38) scale(0.60)"/>
        <use href="#sf3-flame" transform="translate(526.0 122.0) rotate(26)  scale(0.72)"/>
        <use href="#sf3-flame" transform="translate(512.0 142.0) rotate(40)  scale(0.52)"/>
      </g>
      <g fill="var(--brass-hi, #F0CE8E)">
        <use href="#sf3-flame" transform="translate(430.5 116.0) rotate(-24) scale(0.46)"/>
        <use href="#sf3-flame" transform="translate(427.5 88.0)  rotate(-10) scale(0.42)"/>
        <use href="#sf3-flame" transform="translate(525.0 122.0) rotate(24)  scale(0.38)"/>
      </g>
    </g>

    <!-- pan face: inert until the host sets the ink token -->
    <circle cx="478" cy="99" r="42" fill="var(--ink, #0B0910)"/>

    <!-- Philadelphia, trimmed by the rim. The toque crowns the tallest tower:
         a chef in the pan, with no likeness of anyone. -->
    <g clip-path="url(#sf3-inside)" fill="var(--ivory, #F4EDE4)"
       transform="translate(478 99) scale(0.95) translate(-478 -99)">
      <rect x="438" y="134" width="16" height="18"/>
      <rect x="457" y="118" width="7"  height="34"/>
      <path d="M 469 152 L 469 96 L 473 96 L 473 88 L 487 88 L 487 96 L 491 96 L 491 152 Z"/>
      <path d="M 496 152 L 496 104 L 499.5 90 L 503 104 L 503 152 Z"/>
      <rect x="507" y="124" width="9"  height="28"/>
      <rect x="467" y="82" width="26" height="6"/>
      <path d="M 467 82
        C 459.9 82 458.1 75 464.6 73
        C 462.9 67 470.0 64.5 474.1 68
        C 478.2 63 486.5 65 487.1 70
        C 494.8 69.5 498.3 76 493 82 Z"/>
    </g>

    <!-- tapered handle, heavier than the letter weight so it is a pan, not a magnifier -->
    <path fill="var(--ivory, #F4EDE4)"
          d="M 504 49 L 547.1 18.5 A 7 7 0 0 1 558.5 29.9 L 528 73 Z"/>
    <!-- rim -->
    <circle cx="478" cy="99" r="51" fill="none"
            stroke="var(--ivory, #F4EDE4)" stroke-width="18"/>
  </g>

  <!-- ============ WORDMARK: one monoline alphabet, one weight ============ -->
  <g fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="var(--accent, #BB69E6)">
      <use href="#sf3-s"/>
      <path d="M 94 125 L 111 73 L 128 125 M 101 108 L 121 108"/>
      <use href="#sf3-s" x="128"/>
      <use href="#sf3-s" x="188"/>
      <path d="M 279 73 L 298 100 L 317 73 M 298 100 L 298 125"/>
    </g>
    <g stroke="var(--ivory, #F4EDE4)">
      <path d="M 361 125 L 361 73 L 391 73 M 361 99 L 385 99"/>
      <circle cx="591" cy="99" r="26"/>
      <path d="M 645 125 L 645 73 L 664 73 A 26 26 0 0 1 664 125 Z"/>
      <path d="M 718 73 L 718 125"/>
      <path d="M 776 73 L 746 73 L 746 125 L 776 125 M 746 99 L 770 99"/>
    </g>
  </g>
</svg>
